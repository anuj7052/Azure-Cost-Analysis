<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The name alone does not say which cloud, and a tab title is often all
         someone sees of a page they left open yesterday. -->
    <title>Cloudledger — Azure cost and estate</title>
    <meta
      name="description"
      content="Cloudledger reads your Azure cost, running resources, changes and access with your own permissions. Nothing is estimated, and nothing is written back."
    />
    <meta name="theme-color" content="#020617" />

    <!-- What a link to this page looks like when it is pasted somewhere else.
         Worth writing out properly: without an image, LinkedIn and Reddit fall
         back to a small text-only card, and the absolute URL is not optional —
         both refuse a relative one and simply show no image at all. -->
    <meta property="og:site_name" content="Cloudledger" />
    <meta property="og:title" content="Cloudledger — Azure cost and estate" />
    <meta
      property="og:description"
      content="Know what Azure is costing you, and why it moved. Read-only, signed in with Microsoft Entra."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://azure.microsoftupdates.co.in/" />
    <meta
      property="og:image"
      content="https://azure.microsoftupdates.co.in/og-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Cloudledger — know what Azure is costing you, and why it moved. Read-only by default, Microsoft Entra sign-in, nothing estimated."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cloudledger — Azure cost and estate" />
    <meta
      name="twitter:description"
      content="Know what Azure is costing you, and why it moved. Read-only, signed in with Microsoft Entra."
    />
    <meta
      name="twitter:image"
      content="https://azure.microsoftupdates.co.in/og-card.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
