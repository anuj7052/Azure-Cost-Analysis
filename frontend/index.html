<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cloudledger-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The name alone does not say which cloud, and a tab title is often all
         someone sees of a page they left open yesterday. -->
    <title>Azure Cost Analysis &amp; Optimization | Cloudledger</title>
    <meta
      name="description"
      content="Analyze Azure costs, compare monthly spend, review reservations and find idle resources with Cloudledger. Connect your Microsoft account to explore your cloud bill."
    />
    <meta name="theme-color" content="#020617" />

    <!-- The same app answers on the App Service hostname and on the custom
         domain. Without this, those are two sites carrying identical text and
         each is evidence that the other is a copy; whatever authority the page
         earns is split between them. This names one of the two as the real
         one, and it holds on whichever host served the page. -->
    <link rel="canonical" href="https://azure.microsoftupdates.co.in/" />

    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- What a link to this page looks like when it is pasted somewhere else.
         Worth writing out properly: without an image, LinkedIn and Reddit fall
         back to a small text-only card, and the absolute URL is not optional —
         both refuse a relative one and simply show no image at all. -->
    <meta property="og:site_name" content="Cloudledger" />
    <meta property="og:title" content="Azure Cost Analysis &amp; Optimization | Cloudledger" />
    <meta
      property="og:description"
      content="Know what Azure is costing you, and why it moved. Read-only, signed in with Microsoft Entra."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://azure.microsoftupdates.co.in/" />
    <meta
      property="og:image"
      content="https://azure.microsoftupdates.co.in/og-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Cloudledger — know what Azure is costing you, and why it moved. Read-only by default, Microsoft Entra sign-in, nothing estimated."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Azure Cost Analysis &amp; Optimization | Cloudledger" />
    <meta
      name="twitter:description"
      content="Know what Azure is costing you, and why it moved. Read-only, signed in with Microsoft Entra."
    />
    <meta
      name="twitter:image"
      content="https://azure.microsoftupdates.co.in/og-card.png"
    />

    <!-- Written out here rather than rendered by React. A crawler reads the
         HTML the server sent; anything the app adds after its bundle executes
         is seen on a second, slower pass that is not guaranteed. Structured
         data is exactly the thing that must survive the first pass.

         Every claim below is one the product actually makes. Marking up a
         price or a rating that is not on the page is the usual way sites lose
         rich results altogether, and it is not worth the impression.

         The Organization node carries no sameAs list yet. sameAs is what ties
         this site to the same owner's profiles elsewhere, and it is the one
         field an assistant uses to decide that a YouTube channel and a website
         are one voice rather than two strangers agreeing. It stays empty until
         there is a real URL to put in it, because a guessed profile link is a
         claim of identity that is checked, and failing that check costs more
         than the field was ever going to earn. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://azure.microsoftupdates.co.in/#org",
            "name": "Cloudledger",
            "url": "https://azure.microsoftupdates.co.in/",
            "logo": "https://azure.microsoftupdates.co.in/og-card.png",
            "description": "Azure cost and estate reporting, read with the reader's own Microsoft Entra permissions."
          },
          {
            "@type": "WebSite",
            "@id": "https://azure.microsoftupdates.co.in/#website",
            "url": "https://azure.microsoftupdates.co.in/",
            "name": "Cloudledger",
            "description": "Azure cost and estate reporting, read with your own Microsoft Entra permissions.",
            "publisher": { "@id": "https://azure.microsoftupdates.co.in/#org" },
            "inLanguage": "en"
          },
          {
            "@type": "WebPage",
            "@id": "https://azure.microsoftupdates.co.in/#webpage",
            "url": "https://azure.microsoftupdates.co.in/",
            "name": "Azure Cost Analysis & Optimization | Cloudledger",
            "isPartOf": { "@id": "https://azure.microsoftupdates.co.in/#website" },
            "about": { "@id": "https://azure.microsoftupdates.co.in/#app" },
            "inLanguage": "en"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://azure.microsoftupdates.co.in/#app",
            "name": "Cloudledger",
            "url": "https://azure.microsoftupdates.co.in/",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "Cloud cost management",
            "operatingSystem": "Web browser",
            "description": "Explore Azure billed costs, resource inventory, commitments and access. Review forecasts and retail estimates separately from actual costs; Build requires explicit deployment confirmation.",
            "featureList": [
              "Azure cost trends and month-on-month comparison",
              "Cost anomaly detection with likely cause",
              "Resource group and per-resource cost attribution",
              "Orphaned and idle resource discovery",
              "Reservation and savings plan coverage",
              "Bill of quantities against actual spend",
              "Terraform and Bicep generation for review"
            ],
            "publisher": { "@id": "https://azure.microsoftupdates.co.in/#org" },
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "FAQPage",
            "@id": "https://azure.microsoftupdates.co.in/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Does it change anything in my Azure account?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Reporting and cost exploration are read-only. Build can create supported Azure resources, but requires explicit confirmation, workspace-admin authorization and sufficient Azure permissions. Review generated templates and deployment details before creating resources."
                }
              },
              {
                "@type": "Question",
                "name": "What does it cost to run?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The app reads the Azure Cost Management and Resource Graph APIs, which Microsoft does not charge for. If you connect a model endpoint for the assistants, that is billed by your own provider against your own key."
                }
              },
              {
                "@type": "Question",
                "name": "Can I use it across more than one tenant?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Connect each tenant you have access to and switch between them from the top bar. Data from one is never mixed into another."
                }
              },
              {
                "@type": "Question",
                "name": "Where do the numbers come from?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Billed costs come from Azure Cost Management. Resource inventory and findings come from the relevant Azure services. Forecasts, retail-price estimates and optimization projections are distinct from billed actuals. Check the reporting period, freshness and any partial-data messages."
                }
              },
              {
                "@type": "Question",
                "name": "Can my colleagues use it?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You can invite people from your directory and choose what each of them is allowed to do. Roles are checked on the server, not just hidden in the menu."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
